<section aria-labelledby="faq-title" class="py-16 px-4" id="Faq">
  <div class="max-w-3xl mx-auto">

    <!-- Title -->
    <h2
      id="faq-title"
      class="text-3xl font-bold text-center mb-10 text-[#A2AF9B]"
    >
      {{ 'landingpage.faq.title' | translate }}
    </h2>

    <div class="space-y-4">

      @for (f of faqs(); track $index; let i = $index) {

      <article
        class="border border-[#DCCFC0] rounded-xl px-4 py-3 cursor-pointer transition hover:shadow-sm"
      >

        <h3>
          <button
            type="button"
            class="w-full cursor-pointer flex items-center justify-between text-left font-medium text-[#A2AF9B] focus:outline-none focus:ring-2 focus:ring-[#A2AF9B]"
            (click)="toggle(i)"
            [attr.aria-expanded]="f.open"
            [attr.aria-controls]="'faq-panel-' + i"
            [id]="'faq-header-' + i"
          >
            <span>{{ f.question | translate }}</span>

            <!-- Arrow -->
            <span
              class="transition-transform duration-300"
              [class.rotate-180]="f.open"
            >
              ▼
            </span>
          </button>
        </h3>

        @if (f.open) {
        <div
          role="region"
          class="mt-3 text-gray-600"
          [id]="'faq-panel-' + i"
          [attr.aria-labelledby]="'faq-header-' + i"
        >
          <p>{{ f.answer | translate }}</p>
        </div>
        }

      </article>

      }

    </div>
  </div>
</section>
