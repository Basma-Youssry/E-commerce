<section aria-labelledby="contact-title" class="py-16 px-4" id="contact">
  <div class="max-w-3xl mx-auto">

    <!-- Title -->
    <h2 id="contact-title" class="text-3xl font-bold text-center mb-8 text-[#A2AF9B]">
      {{'landingpage.contact.title' | translate}}
    </h2>

    <!-- Form -->
    <form [formGroup]="contactForm()" class="space-y-6 bg-white p-6 rounded-2xl shadow-sm border border-[#DCCFC0]"
      (ngSubmit)="submit()">

      <!-- Name -->
      <div>
        <app-input [control]="contactForm().get('firstName')" [typeInput]="'text'"
                            [idInput]="'firstName'" [labelInput]="'landingpage.contact.name_label' | translate"
                            [placeholder]="'contactUs.fN' | translate"></app-input>
      </div>

      <!-- Email -->
      <div>
        <app-input [control]="contactForm().get('email')" [typeInput]="'email'" [idInput]="'email'"
          [labelInput]="'contactUs.Email' | translate" [placeholder]="'Ahmed@gmail.com'"></app-input>
      </div>

      <!-- Message -->
      <div>
        <app-input [element]="'textarea'" [control]="contactForm().get('message')"
          [labelInput]="'contactUs.message' | translate" [placeholder]="'contactUs.writeYourMessage' | translate">
        </app-input>
      </div>

      <!-- Button -->
      <button type="submit"
        class="w-full cursor-pointer py-2 text-white font-semibold rounded-full transition hover:opacity-90"
        style="background-color: #A2AF9B;">
        {{'landingpage.contact.submit' | translate}}
      </button>

    </form>
  </div>
</section>
