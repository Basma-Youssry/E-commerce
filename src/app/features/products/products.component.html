<section class="top-products card-bg py-20">
    <div class="container">
        <div class="caption">
            <h4 class="head">Top Products</h4>
            <h2 class=" text-gray-800">Top Picks For You!</h2>
        </div>
        <div class="cards grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-3 gap-y-20">
            @for (product of allProducts| paginate: { id: 'foo',
            itemsPerPage: pageSize,
            currentPage: p,
            totalItems: total }; track product._id) {
            <app-card [product]="product" />
            }
        </div>

        <div class="flex justify-center mt-6">
            <pagination-controls class="my-pagination" id="foo" (pageChange)="getAllProductsData($event)">

            </pagination-controls>
        </div>


    </div>
</section>
