<section class="top-products card-bg py-20">
    <div class="container">
        <div class="caption">
            <h2 class="head">Top Products</h2>
            <p class=" text-gray-800">Top Picks For You!</p>
        </div>
        <div class="cards grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-3 gap-y-20">
            @for (product of allProducts().slice(0,8); track product._id) {
            <app-card [product]="product" />
            }
        </div>
    </div>
</section>
