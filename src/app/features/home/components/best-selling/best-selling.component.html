<section class="best-selling card-bg py-20">
    <div class="container">
        <div class="caption">
            <h4 class="head">Products</h4>
            <h2 class=" text-gray-800">Best Selling Products</h2>

            <div class="inline-flex shadow-xs my-3 p-1 rounded-full bg-[#bcbcdc]" role="group">
                <button (click)="allbtn()" type="button"
                    class="rounded-s-full px-4 py-2 text-sm font-medium cursor-pointer text-gray-800 focus:z-10  focus:bg-[#415E72] focus:text-white focus:rounded-full dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:text-white dark:hover:bg-gray-700 dark:focus:ring-blue-500 dark:focus:text-white">
                    All
                </button>
                @for (cat of categoriesList.slice(0, 3); track $index) {
                <button (click)="selectCategory(cat)" type="button"
                    class="rounded-s-full px-4 py-2 text-sm font-medium cursor-pointer text-gray-800 focus:z-10  focus:bg-[#415E72] focus:text-white focus:rounded-full dark:bg-gray-800 dark:border-gray-700 dark:text-white dark:hover:text-white dark:hover:bg-gray-700 dark:focus:ring-blue-500 dark:focus:text-white">
                    {{cat.name}}
                </button>
                
                }
            </div>

        </div>

        <div class="cards grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-3 gap-y-20">
            @for (category of categoriesList.slice(0,8); track category._id) {
            <app-card [category]="category" [categoryName]="categoryName" />
            }
        </div>
    </div>
</section>
