<section class="bg-[#EEEEEE]">
  <div class="container flex flex-col items-center">

    <div class="w-full grid 
                grid-cols-2 
                sm:grid-cols-3 
                md:grid-cols-4 
                gap-6 mb-20">

      <!-- Brand Card -->
      @for (brand of allBrands(); track $index) {
      <div class="bg-white rounded-2xl shadow 
                  hover:shadow-xl transition 
                  p-8 h-32 flex items-center justify-center">
        <img [src]="brand.image" alt="Dell" class="h-12 object-contain">
      </div>
      }
    </div>

    <div class="bg-white w-full max-w-4xl mx-4 rounded-lg shadow-sm py-16 px-6 md:px-10 text-center">

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div class="p-4 rounded-md">
        <svg xmlns="http://www.w3.org/2000/svg" 
             class="h-[49px] w-[50px] text-[#A2AF9B]" 
             fill="none" 
             viewBox="0 0 24 24" 
             stroke="currentColor">
          <path stroke-linecap="round" 
                stroke-linejoin="round" 
                stroke-width="2" 
                d="M3 8l9 6 9-6M4 6h16a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V7a1 1 0 011-1z"/>
        </svg>
      </div>
    </div>

    <!-- Title -->
    <h2 class="text-lg font-semibold text-gray-800 mb-2">
      Get The Fresh cart App
    </h2>

    <!-- Subtitle -->
    <p class="text-gray-500 mb-8 text-sm">
      We Will Send You A Link, Open It On Your Phone!
    </p>

    <!-- Input + Button -->
    <div class="flex justify-center items-center gap-3 md:gap-4">

      <input type="email"
             placeholder="Enter your email"
             class="sm:w-65 md:w-96 text-[12px]  md:text-[16px] px-4 py-3 border border-[#A2AF9B]
                    rounded-md focus:outline-none
              focus:ring-0" />

      <button class="bg-[#A2AF9B] text-[11px]  md:text-[16px] text-white 
      <!--problem1 There a problem here sm:py-3 didn't work -->
                     px-6 py-4 sm:py-3 rounded-md    
                      transition cursor-pointer">
        Share APP Link
      </button>

    </div>

  </div>

  </div>
</section>
